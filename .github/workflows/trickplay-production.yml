name: Litefin Trickplay - Production ARM Universal

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Stable Litefin tag (blank = latest stable)'
        required: false
        type: string
      revision:
        description: 'Custom revision (1-999; increase when rebuilding same Litefin version)'
        required: true
        default: '1'
        type: string
      publish:
        description: 'Publish signed APK to public GitHub Releases (only after testing)'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: read

concurrency:
  group: litefin-trickplay-production
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      revision: ${{ steps.version.outputs.revision }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Resolve stable upstream release and skip existing published versions
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.upstream_tag }}
          MANUAL_REV: ${{ inputs.revision }}
          AUTO_PUBLISH: ${{ vars.ENABLE_AUTO_PUBLISH }}
        run: |
          set -euo pipefail
          echo 'build=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$AUTO_PUBLISH" != true ]]; then
            echo 'Automatic publication disabled; set ENABLE_AUTO_PUBLISH=true after first release validation.'
            exit 0
          fi
          tag="${MANUAL_TAG:-$(gh api repos/MoazSalem/litefin/releases/latest --jq .tag_name)}"
          rev="${MANUAL_REV:-1}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a stable release tag: $tag"; exit 1; }
          [[ "$rev" =~ ^[1-9][0-9]{0,2}$ ]] || { echo "Bad revision: $rev"; exit 1; }
          release_tag="${tag}-trickplay.${rev}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already published: $release_tag"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo 'build=true' >> "$GITHUB_OUTPUT"
          echo "Preparing $release_tag"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Download upstream tagged source
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: git clone --branch "$TAG" --depth 1 https://github.com/MoazSalem/litefin.git upstream
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android 37 and NDK 27
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools' 'ndk;27.0.12077973'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Patch source and test continuous seek
        run: |
          node apply.mjs upstream
          node --test tests/continuous-trickplay.test.mjs tests/patch-anchors-test.mjs tests/prepare-production.test.mjs
          node --test upstream/tests/continuous-trickplay.test.mjs
      - name: Install Litefin dependencies
        working-directory: upstream
        run: npm ci
      - name: Synchronize upstream version
        working-directory: upstream
        run: npm run sync:version
      - name: Set production Android identity and version
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          REV: ${{ needs.resolve.outputs.revision }}
        run: node prepare-production.mjs upstream "$TAG" "$REV"
      - name: Compile ARM32 + ARM64 universal unsigned release APK
        working-directory: upstream
        run: npm run tauri -- android build --apk --target aarch64 --target armv7
      - name: Validate unsigned APK, architecture, and application ID
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find upstream/src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*unsigned*.apk')
          if [[ "${#files[@]}" -ne 1 ]]; then
            printf 'Found %s unsigned APKs (expected 1):\n' "${#files[@]}"; printf '%s\n' "${files[@]}"
            exit 1
          fi
          mkdir -p out
          cp "${files[0]}" out/litefin-trickplay-universal-unsigned.apk
          unzip -Z -1 out/*.apk > out/apk-entries.txt
          grep -q '^lib/arm64-v8a/.*\.so$' out/apk-entries.txt
          grep -q '^lib/armeabi-v7a/.*\.so$' out/apk-entries.txt
          ! grep -Eq '^lib/(x86|x86_64)/' out/apk-entries.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging out/*.apk | grep "package: name='org.litefin.app.trickplay'"
          du -h out/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-litefin-trickplay
          path: out/litefin-trickplay-universal-unsigned.apk
          if-no-files-found: error
          retention-days: 2

  sign:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    environment: production-signing
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-litefin-trickplay
          path: unsigned
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install APK signing tools
        run: sdkmanager --install 'build-tools;37.0.0'
      - name: Sign and verify APK with permanent key
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [[ -n "$KEY_BASE64" && -n "$KEY_PASSWORD" && -n "$KEY_ALIAS" ]] || { echo 'Missing signing environment secrets'; exit 1; }
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/trickplay-release.jks"
          chmod 600 "$RUNNER_TEMP/trickplay-release.jks"
          mkdir -p signed
          export KS_PASS="$KEY_PASSWORD"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/trickplay-release.jks" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out signed/litefin-trickplay-universal.apk \
            unsigned/litefin-trickplay-universal-unsigned.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs signed/litefin-trickplay-universal.apk
          ( cd signed && sha256sum litefin-trickplay-universal.apk > SHA256SUMS.txt )
          rm -f "$RUNNER_TEMP/trickplay-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-litefin-trickplay
          path: signed/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, sign]
    if: (github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'schedule' && vars.ENABLE_AUTO_PUBLISH == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-litefin-trickplay
          path: signed
      - name: Publish versioned signed APK and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            signed/litefin-trickplay-universal.apk signed/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Litefin Trickplay $RELEASE_TAG" \
            --notes "Unofficial Android TV release. Upstream Litefin: $UPSTREAM_TAG. Continuous 4×/8×/16×/32×/64× FF/RWD trickplay. ARM32 + ARM64. Independently maintained; no guaranteed support. Release source: this repository at $GITHUB_SHA."
